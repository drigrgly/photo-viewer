<div class="info">
  <h3 class="date">{{photoModel().date.getFullYear()}}.{{(photoModel().date.getMonth() + 1).toString().padStart(2, "0")}}.{{photoModel().date.getDate().toString().padStart(2, "0")}}</h3>
  <h1 class="name">{{photoModel().name}}</h1>
  <span class="separator"></span>
  <h2 class="owner">{{photoModel().ownerId}}</h2>
</div>

<div class="actions">
  <button class="btn"><i class="material-icons-outlined">visibility</i>View</button>
</div>
